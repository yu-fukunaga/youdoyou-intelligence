repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: make gitleaks
        language: system
        pass_filenames: false

      - id: functions-secure
        name: functions/secure
        entry: make functions/secure SKIP_GITLEAKS=1
        language: system
        files: ^functions/
        pass_filenames: false

      - id: functions-lint
        name: functions/lint
        entry: make functions/lint
        language: system
        types: [go]
        files: ^functions/
        pass_filenames: false

      - id: server-secure
        name: server/secure
        entry: make server/vulncheck
        language: system
        files: ^server/
        pass_filenames: false

      - id: server-lint
        name: server/lint
        entry: make server/lint
        language: system
        types: [go]
        files: ^server/
        pass_filenames: false

      - id: client-secure
        name: client/secure
        entry: make client/semgrep
        language: system
        types: [swift]
        files: ^client/
        pass_filenames: false

      - id: client-lint
        name: client/lint
        entry: make client/lint
        language: system
        types: [swift]
        files: ^client/
        pass_filenames: false

      - id: client-test
        name: client/test
        entry: make client/test
        language: system
        types: [swift]
        files: ^client/
        pass_filenames: false

      - id: client-format
        name: client/format
        entry: make client/format
        language: system
        types: [swift]
        files: ^client/
        pass_filenames: false

      - id: terraform-fmt
        name: terraform/fmt
        entry: make terraform/fmt-check
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: terraform-lint
        name: terraform/lint
        entry: make terraform/lint
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: terraform-validate
        name: terraform/validate
        entry: make terraform/validate/dev
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: homepage-secure
        name: homepage/secure
        entry: make homepage/secure
        language: system
        files: ^homepage/layouts/.*\.html$
        pass_filenames: false

      - id: homepage-lint
        name: homepage/lint
        entry: make homepage/lint
        language: system
        files: ^homepage/layouts/.*\.html$
        pass_filenames: false

      - id: makefile-aggregate-check
        name: Makefile.agg is up to date
        entry: bash -c 'make aggregate && git diff --exit-code -- Makefile.agg'
        language: system
        files: ^[^/]+/Makefile$|^Makefile\.agg$
        pass_filenames: false
